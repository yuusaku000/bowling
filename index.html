<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ふつうのボウリング場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* 1画面のゲーム。ボウリング場のスコア表のようなカードを1枚重ねる。見た目は夜のボウリング場で固定。 */
:root {
  --night: #141a2a;
  --card: rgba(16, 20, 34, 0.9);
  --ink: #f4efe6;
  --ink-dim: #aeb0b8;
  --lane: #e7b46c;
  --pin-red: #e04a3a;
  --line: rgba(244, 239, 230, 0.16);
  --font-display: "Dela Gothic One", "Hiragino Kaku Gothic StdN", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#overlay {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(180deg, rgba(20,26,42,0.35), rgba(20,26,42,0.85));
}
.card {
  width: 100%; max-width: 31rem; background: var(--card); border: 1px solid var(--line); border-radius: 6px;
  padding: 1.5rem 1.5rem 1.3rem; display: flex; flex-direction: column; gap: 0.9rem;
}
.eyebrow { margin: 0; font-size: 0.74rem; letter-spacing: 0.18em; color: var(--ink-dim); }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 8vw, 2.8rem); line-height: 1.05; margin: 0; text-wrap: balance; }
h1 small { display: block; font-family: var(--font-body); font-size: 0.9rem; font-weight: 700; color: var(--lane); letter-spacing: 0.1em; margin-top: 0.4rem; }
.boards { height: 12px; border-radius: 2px; background: repeating-linear-gradient(90deg, #e7b46c 0 9px, #d9a35c 9px 18px); position: relative; }
.boards::after { content: ""; position: absolute; left: 50%; top: 2px; width: 0; height: 0; margin-left: -5px; border-left: 5px solid transparent; border-right: 5px solid transparent; border-bottom: 8px solid #3a2a1c; }
.how { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.45rem; font-size: 0.93rem; line-height: 1.6; }
.how li { display: grid; grid-template-columns: 4.8rem 1fr; gap: 0.6rem; }
.how b { color: var(--lane); font-weight: 700; }
.buttons { display: flex; flex-wrap: wrap; gap: 0.6rem; }
button {
  font: inherit; font-weight: 700; font-size: 1rem; padding: 0.8rem 1.2rem; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--lane); color: var(--ink); background: transparent; flex: 1 1 10rem;
}
button.primary { background: var(--lane); color: #22170c; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
#note { margin: 0; font-size: 0.82rem; color: var(--ink-dim); line-height: 1.6; }
/* パソコン用の「ため」のメーター */
#power {
  position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  width: min(320px, 70vw); height: 16px; border-radius: 8px; background: rgba(10, 12, 22, 0.7);
  border: 1px solid var(--line); overflow: hidden; pointer-events: none;
}
#power i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #e7b46c, #ff7a3a, #ff3b5c); }
#power span { position: absolute; left: 0; right: 0; top: -24px; text-align: center; font-size: 0.8rem; color: var(--ink-dim); }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="power" hidden><span>はなすと投げる</span><i></i></div>

<div id="overlay">
  <div class="card">
    <p class="eyebrow" id="eyebrow">全10ゲーム ・ 3枚から1枚えらぶ</p>
    <h1>ふつうのボウリング場<small>…のはずだった</small></h1>
    <div class="boards" aria-hidden="true"></div>
    <ul class="how">
      <li><b>なげる</b><span>引き金を押して玉を持ち、腕を前にふって、引き金をはなす。ふる速さで玉の速さが決まります。</span></li>
      <li><b>立ち位置</b><span>タッチパッドの左右で、立つ場所を動かせます。</span></li>
      <li><b>ルール</b><span>ピン1本＝1点。1ゲーム3球で目標点をこえたらクリア。3枚のカードから1枚えらんで、次のゲームへ。届かなかったら最初から。</span></li>
      <li><b>パソコン</b><span>マウスでねらって、左ボタンを押しつづけて力をためて、はなす。A・Dキーで立ち位置。</span></li>
    </ul>
    <div class="buttons">
      <button id="btnVR" class="primary" disabled>VRで遊ぶ</button>
      <button id="btnFlat">画面で遊ぶ</button>
    </div>
    <p id="note">VRが使えるか調べています…</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
(function () {
  "use strict";

  // ===== 決まりごと（長さはメートル） =====
  var EYE = 1.6;
  var LANE_HALF = 1.1;            // 横に広いレーン（ふつうの約2倍）
  var HEAD_Z = -18.29;            // 先頭のピンの位置
  var DECK_END = -23;             // ピンを置く台の終わり
  var PLAYER_Z = 1.3;             // 立つ位置
  var BALL_R = 0.109, BALL_MASS = 7;
  var TOTAL_GAMES = 10;
  var BALLS_PER_GAME = 3;
  var MAX_PINS = 220;
  var TARGETS = [15, 24, 36, 52, 72, 98, 130, 170, 220, 280];
  var LANE_SPACING = 3.3;

  var canvas = document.getElementById("view");
  var overlay = document.getElementById("overlay");
  var btnVR = document.getElementById("btnVR");
  var btnFlat = document.getElementById("btnFlat");
  var note = document.getElementById("note");
  var eyebrow = document.getElementById("eyebrow");
  var powerEl = document.getElementById("power");
  var powerBar = powerEl.querySelector("i");

  // ===== 描画の準備 =====
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType("local");
  if (renderer.xr.setFoveation) renderer.xr.setFoveation(1);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0e1220);
  scene.fog = new THREE.Fog(0x0e1220, 20, 45);

  var camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.03, 200);
  camera.rotation.order = "YXZ";
  var rig = new THREE.Group();
  rig.add(camera);
  scene.add(rig);

  scene.add(new THREE.HemisphereLight(0xfff2dc, 0x2a2438, 0.75));
  var key = new THREE.DirectionalLight(0xfff0d8, 0.35); key.position.set(2, 6, 4); scene.add(key);
  var deckLight = new THREE.PointLight(0xfff6e8, 1.6, 10, 2); deckLight.position.set(0, 1.8, -19.5); scene.add(deckLight);
  var laneLight1 = new THREE.PointLight(0xffe6c4, 0.8, 10, 2); laneLight1.position.set(0, 2.8, -4); scene.add(laneLight1);
  var laneLight2 = new THREE.PointLight(0xffe6c4, 0.6, 10, 2); laneLight2.position.set(0, 2.8, -11); scene.add(laneLight2);

  // ===== 小さな道具 =====
  function canvasTex(w, h, draw) {
    var c = document.createElement("canvas"); c.width = w; c.height = h;
    draw(c.getContext("2d"), w, h);
    return new THREE.CanvasTexture(c);
  }
  function box(w, h, d, mat) { return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  var glowTex = canvasTex(64, 64, function (g) {
    var gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.3, "rgba(255,255,255,0.5)"); gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  });
  function glowSprite(color, size, opacity) {
    var s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: color, transparent: true, opacity: opacity, blending: THREE.AdditiveBlending, depthWrite: false }));
    s.scale.set(size, size, 1);
    return s;
  }
  function wrapText(ctx, text, maxW) {
    var lines = [], cur = "";
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (ch === "\n") { lines.push(cur); cur = ""; continue; }
      if (ctx.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch; } else cur += ch;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  // ===== ボウリング場の見た目 =====
  var laneTex = canvasTex(256, 512, function (g) {
    for (var i = 0; i < 39; i++) {
      var x0 = Math.floor(i * 256 / 39), x1 = Math.floor((i + 1) * 256 / 39);
      var t = (i % 3 === 0) ? 0 : (i % 3 === 1 ? 10 : -8);
      g.fillStyle = "rgb(" + (226 + t) + "," + (176 + t) + "," + (108 + t) + ")";
      g.fillRect(x0, 0, x1 - x0, 512);
      g.fillStyle = "rgba(90,55,25,0.25)"; g.fillRect(x0, 0, 1, 512);
    }
    for (var k = 0; k < 140; k++) {
      g.fillStyle = "rgba(120,80,40," + rand(0.04, 0.1) + ")";
      g.fillRect(rand(0, 256), rand(0, 512), 1, rand(20, 90));
    }
    for (var j = 0; j < 4; j++) { g.fillStyle = "rgba(80,50,20,0.25)"; g.fillRect(0, j * 128 + rand(0, 100), 256, 1); }
  });
  laneTex.wrapS = laneTex.wrapT = THREE.RepeatWrapping;
  laneTex.repeat.set(LANE_HALF * 2 / 1.066, 10);
  var laneMat = new THREE.MeshPhongMaterial({ map: laneTex, shininess: 90, specular: 0x5a4a3a });
  var gutterMat = new THREE.MeshPhongMaterial({ color: 0x2b2f38, shininess: 60, specular: 0x444444 });
  var capMat = new THREE.MeshLambertMaterial({ color: 0x1b1e26 });
  var darkMat = new THREE.MeshLambertMaterial({ color: 0x15171d });

  var pinTex = canvasTex(8, 128, function (g) {
    g.fillStyle = "#f6f3ee"; g.fillRect(0, 0, 8, 128);
    g.fillStyle = "#d63a2c";
    g.fillRect(0, Math.floor(128 * (1 - 0.66)), 8, 5);
    g.fillRect(0, Math.floor(128 * (1 - 0.6)), 8, 9);
  });
  var pinProfile = [[0.0, 0], [0.027, 0], [0.041, 0.02], [0.058, 0.08], [0.0605, 0.114], [0.056, 0.16], [0.041, 0.22], [0.025, 0.255], [0.023, 0.28], [0.029, 0.315], [0.032, 0.34], [0.026, 0.368], [0.012, 0.381], [0.0, 0.381]];
  var pinGeo = new THREE.LatheGeometry(pinProfile.map(function (p) { return new THREE.Vector2(p[0], p[1]); }), 10);
  var pinGeoCentered = pinGeo.clone(); pinGeoCentered.translate(0, -0.19, 0);
  var pinMat = new THREE.MeshPhongMaterial({ map: pinTex, shininess: 70, specular: 0x666666 });

  var LANE_XS = [-2 * LANE_SPACING, -LANE_SPACING, 0, LANE_SPACING, 2 * LANE_SPACING];
  function buildLane(cx, active) {
    var g = new THREE.Group();
    var len = -DECK_END;
    var lane = box(LANE_HALF * 2, 0.04, len, laneMat); lane.position.set(cx, -0.02, DECK_END / 2); g.add(lane);
    [-1, 1].forEach(function (s) {
      var gut = box(0.24, 0.02, len, gutterMat); gut.position.set(cx + s * (LANE_HALF + 0.12), -0.12, DECK_END / 2); g.add(gut);
      var side = box(0.02, 0.12, len, gutterMat); side.position.set(cx + s * (LANE_HALF + 0.25), -0.06, DECK_END / 2); g.add(side);
      var cap = box(0.14, 0.04, len, capMat); cap.position.set(cx + s * (LANE_HALF + 0.33), 0, DECK_END / 2); g.add(cap);
      var kb = box(0.06, 0.9, 6.6, darkMat); kb.position.set(cx + s * (LANE_HALF + 0.28), 0.35, -19.8); g.add(kb);
    });
    var mark = new THREE.MeshBasicMaterial({ color: 0x2a1c10 });
    var foul = box(LANE_HALF * 2, 0.002, 0.03, mark); foul.position.set(cx, 0.001, 0); g.add(foul);
    var arrowShape = new THREE.Shape(); arrowShape.moveTo(0, 0.14); arrowShape.lineTo(-0.035, -0.07); arrowShape.lineTo(0.035, -0.07); arrowShape.lineTo(0, 0.14);
    var arrowGeo = new THREE.ShapeGeometry(arrowShape);
    for (var a = -6; a <= 6; a++) {
      var ar = new THREE.Mesh(arrowGeo, mark);
      ar.rotation.x = -Math.PI / 2; ar.position.set(cx + a * 0.16, 0.002, -4.6 - Math.abs(a) * 0.3); g.add(ar);
      var dot = new THREE.Mesh(new THREE.CircleGeometry(0.013, 8), mark);
      dot.rotation.x = -Math.PI / 2; dot.position.set(cx + a * 0.16, 0.002, -2.1); g.add(dot);
    }
    var approach = box(LANE_HALF * 2 + 0.6, 0.04, 4.6, new THREE.MeshPhongMaterial({ color: 0xe9c18a, shininess: 40 }));
    approach.position.set(cx, -0.02, 2.3); g.add(approach);
    var pit = box(LANE_HALF * 2 + 0.6, 0.04, 2.1, darkMat); pit.position.set(cx, -0.72, -24); g.add(pit);
    var cushion = box(LANE_HALF * 2 + 0.6, 1.4, 0.1, new THREE.MeshLambertMaterial({ color: 0x0b0c10 })); cushion.position.set(cx, 0, -25.1); g.add(cushion);
    scene.add(g);
    if (!active) {
      var inst = new THREE.InstancedMesh(pinGeo, pinMat, 10), m = new THREE.Matrix4(), i = 0;
      for (var r = 0; r < 4; r++) for (var k = 0; k <= r; k++) {
        m.makeTranslation(cx + (k - r / 2) * 0.305, 0, HEAD_Z - r * 0.264);
        inst.setMatrixAt(i++, m);
      }
      scene.add(inst);
    }
  }
  LANE_XS.forEach(function (x) { buildLane(x, x === 0); });

  // ボールリターン
  [-LANE_SPACING / 2, LANE_SPACING / 2, -LANE_SPACING * 1.5, LANE_SPACING * 1.5].forEach(function (x) {
    var base = box(0.5, 0.5, 1.4, new THREE.MeshPhongMaterial({ color: 0x3a3f52, shininess: 50 }));
    base.position.set(x, 0.25, 2.6); scene.add(base);
    var hood = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.5, 16, 1, false, 0, Math.PI), new THREE.MeshPhongMaterial({ color: 0x8fa3c8, shininess: 90, transparent: true, opacity: 0.6 }));
    hood.rotation.z = Math.PI / 2; hood.rotation.y = Math.PI / 2; hood.position.set(x, 0.5, 2.3); scene.add(hood);
    var cols = [0x1d4fa0, 0xb3262e, 0x2b8a55];
    for (var b = 0; b < 3; b++) {
      var bb = new THREE.Mesh(new THREE.SphereGeometry(0.1, 14, 10), new THREE.MeshPhongMaterial({ color: cols[b], shininess: 100, specular: 0xffffff }));
      bb.position.set(x, 0.6, 2.3 + b * 0.22); scene.add(bb);
    }
  });

  // 床、壁、天井
  var ROOM_HALF = LANE_SPACING * 2 + 1.9;
  (function () {
    var carpetTex = canvasTex(128, 128, function (g) {
      g.fillStyle = "#2a1f4a"; g.fillRect(0, 0, 128, 128);
      var cols = ["#e0563c", "#3fb6c9", "#f1c04f", "#8d5fd3"];
      for (var i = 0; i < 26; i++) {
        g.strokeStyle = cols[i % 4]; g.lineWidth = 3;
        var x = rand(0, 128), y = rand(0, 128);
        if (i % 3 === 0) { g.beginPath(); g.arc(x, y, rand(5, 12), 0, 6.3); g.stroke(); }
        else if (i % 3 === 1) { g.beginPath(); g.moveTo(x, y); g.lineTo(x + 14, y + 6); g.lineTo(x + 4, y + 16); g.stroke(); }
        else { g.fillStyle = cols[(i + 1) % 4]; g.fillRect(x, y, 5, 5); }
      }
    });
    carpetTex.wrapS = carpetTex.wrapT = THREE.RepeatWrapping; carpetTex.repeat.set(14, 4);
    var carpet = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_HALF * 2, 6), new THREE.MeshLambertMaterial({ map: carpetTex }));
    carpet.rotation.x = -Math.PI / 2; carpet.position.set(0, -0.03, 7.6); scene.add(carpet);
    var under = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_HALF * 2, 34), darkMat);
    under.rotation.x = -Math.PI / 2; under.position.set(0, -0.75, -9); scene.add(under);
    var wallMat = new THREE.MeshLambertMaterial({ color: 0x232845 });
    [-ROOM_HALF, ROOM_HALF].forEach(function (x) { var w = box(0.2, 3.6, 38, wallMat); w.position.set(x, 1.6, -8); scene.add(w); });
    var backWall = box(ROOM_HALF * 2, 3.6, 0.2, wallMat); backWall.position.set(0, 1.6, 10.6); scene.add(backWall);
    var ceil = box(ROOM_HALF * 2, 0.1, 38, new THREE.MeshLambertMaterial({ color: 0x0f111a })); ceil.position.set(0, 3.4, -8); scene.add(ceil);
    var lightMat = new THREE.MeshBasicMaterial({ color: 0xfff1d8 });
    for (var z = 4; z > -17; z -= 3) {
      LANE_XS.forEach(function (x) { [-0.6, 0.6].forEach(function (o) { var l = box(0.4, 0.03, 1.2, lightMat); l.position.set(x + o, 3.34, z); scene.add(l); }); });
    }
    var neonCols = [0xff4fa0, 0x45d4ff];
    [-ROOM_HALF + 0.12, ROOM_HALF - 0.12].forEach(function (x, i) {
      var n = box(0.04, 0.05, 34, new THREE.MeshBasicMaterial({ color: neonCols[i] })); n.position.set(x, 2.7, -7); scene.add(n);
    });
    var seatMat = new THREE.MeshPhongMaterial({ color: 0xc23b3b, shininess: 40 });
    LANE_XS.forEach(function (x) {
      var seat = box(2.0, 0.45, 0.6, seatMat); seat.position.set(x, 0.22, 6.2); scene.add(seat);
      var back = box(2.0, 0.6, 0.15, seatMat); back.position.set(x, 0.6, 6.5); scene.add(back);
      var table = box(0.6, 0.7, 0.6, new THREE.MeshLambertMaterial({ color: 0x3a3f52 })); table.position.set(x, 0.35, 5.3); scene.add(table);
    });
  })();

  // ピンの上の飾り板
  var MASK_W = ROOM_HALF * 2;
  var maskCanvas = document.createElement("canvas"); maskCanvas.width = 1024; maskCanvas.height = 160;
  var maskTex = new THREE.CanvasTexture(maskCanvas);
  var maskPanel = new THREE.Mesh(new THREE.PlaneGeometry(MASK_W, MASK_W * 160 / 1024), new THREE.MeshBasicMaterial({ map: maskTex }));
  maskPanel.position.set(0, 2.6, -16.6); scene.add(maskPanel);
  function drawMask(gameNo) {
    var g = maskCanvas.getContext("2d");
    var gr = g.createLinearGradient(0, 0, 0, 160);
    gr.addColorStop(0, "#1b2752"); gr.addColorStop(1, "#0d1330");
    g.fillStyle = gr; g.fillRect(0, 0, 1024, 160);
    g.strokeStyle = "rgba(255,199,90,0.55)"; g.lineWidth = 3;
    for (var i = 0; i < 8; i++) { g.beginPath(); g.moveTo(i * 150 - 40, 160); g.lineTo(i * 150 + 70, 0); g.stroke(); }
    g.fillStyle = "#f1c04f";
    for (var s = 0; s < 14; s++) { var x = rand(20, 1000), y = rand(12, 60); g.fillRect(x - 1, y - 6, 2, 12); g.fillRect(x - 6, y - 1, 12, 2); }
    LANE_XS.forEach(function (lx, idx) {
      var px = 512 + lx / MASK_W * 1024;
      var num = gameNo + (idx - 2);
      g.fillStyle = lx === 0 ? "#ffcf5a" : "rgba(255,255,255,0.55)";
      g.font = "bold " + (lx === 0 ? 70 : 48) + "px 'Dela Gothic One', 'Yu Gothic', sans-serif";
      g.textAlign = "center";
      if (num >= 1 && num <= TOTAL_GAMES) g.fillText(String(num), px, 128);
    });
    maskTex.needsUpdate = true;
  }

  // ===== 物理の世界 =====
  var world = new CANNON.World();
  world.gravity.set(0, -9.82, 0);
  world.broadphase = new CANNON.SAPBroadphase(world);
  world.allowSleep = true;
  world.solver.iterations = 8;
  var mLane = new CANNON.Material("lane"), mBall = new CANNON.Material("ball"), mPin = new CANNON.Material("pin"), mWall = new CANNON.Material("wall");
  world.addContactMaterial(new CANNON.ContactMaterial(mLane, mBall, { friction: 0.03, restitution: 0.05 }));
  world.addContactMaterial(new CANNON.ContactMaterial(mLane, mPin, { friction: 0.3, restitution: 0.25 }));
  world.addContactMaterial(new CANNON.ContactMaterial(mBall, mPin, { friction: 0.1, restitution: 0.7 }));
  world.addContactMaterial(new CANNON.ContactMaterial(mPin, mPin, { friction: 0.15, restitution: 0.7 }));
  world.addContactMaterial(new CANNON.ContactMaterial(mWall, mPin, { friction: 0.2, restitution: 0.75 }));
  world.addContactMaterial(new CANNON.ContactMaterial(mWall, mBall, { friction: 0.1, restitution: 0.3 }));
  function staticBox(hx, hy, hz, x, y, z, mat) {
    var b = new CANNON.Body({ mass: 0, material: mat });
    b.addShape(new CANNON.Box(new CANNON.Vec3(hx, hy, hz)));
    b.position.set(x, y, z);
    world.addBody(b);

  var samples = [];
  var ray = new THREE.Raycaster();
  var pointer = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -3)]),
    new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 }));
  pointer.visible = false;
  function attachToCtrl(ctrl) {
    if (pointer.parent !== ctrl) { ctrl.add(pointer); ctrl.add(handBall); handBall.position.set(0, -0.04, -0.12); }
  }
  for (var ci2 = 0; ci2 < 2; ci2++) {
    (function (ctrl) {
      ctrl.addEventListener("connected", function () { activeCtrl = ctrl; attachToCtrl(ctrl); });
      ctrl.addEventListener("selectstart", function () { activeCtrl = ctrl; attachToCtrl(ctrl); startAudio(); onPress(); });
      ctrl.addEventListener("selectend", function () { onRelease(); });
      rig.add(ctrl);
    })(renderer.xr.getController(ci2));
  }

  function onPress() {
    if (state === "over" || state === "win") { bigText.visible = false; newRun(); return; }
    if (state === "cards") { var s = hoverSlot(); if (s >= 0) takeCard(s); return; }
    if (state === "ready") { holding = true; samples = []; hasPrev = false; holdT = 0; }
  }
  function onRelease() {
    if (!holding) return;
    holding = false;
    if (state !== "ready") return;
    if (renderer.xr.isPresenting) {
      var now = performance.now(), maxW = 0;
      samples.forEach(function (s) { if (now - s.t < 180) maxW = Math.max(maxW, s.w); });
      var fwd = new THREE.Vector3(0, 0, -1);
      if (activeCtrl) { activeCtrl.getWorldQuaternion(qNow); fwd.applyQuaternion(qNow); }
      var flat = Math.sqrt(fwd.x * fwd.x + fwd.z * fwd.z);
      var ang = flat > 0.3 ? Math.atan2(fwd.x, -fwd.z) : 0;
      // ふりが弱くても、ちゃんと気持ちよく転がるように最低の速さを高めにする
      throwBall(5 + maxW * 0.8, ang * 0.4);
    } else {
      throwBall(5 + holdPower() * 8, aimX * 0.07);
    }
  }
  function sampleSwing(dt) {
    if (!activeCtrl || !holding) return;
    activeCtrl.getWorldQuaternion(qNow);
    if (hasPrev && dt > 0) {
      var d = qNow.clone().multiply(prevQ.clone().invert());
      var w = 2 * Math.acos(clamp(Math.abs(d.w), -1, 1)) / dt;
      samples.push({ t: performance.now(), w: w });
      if (samples.length > 40) samples.shift();
    }
    prevQ.copy(qNow); hasPrev = true;
  }
  function pollPad(dt) {
    var session = renderer.xr.getSession();
    if (!session || state !== "ready" || holding) return;
    for (var i = 0; i < session.inputSources.length; i++) {
      var gp = session.inputSources[i].gamepad;
      if (!gp || !gp.axes) continue;
      var ax = 0;
      for (var a = 0; a < gp.axes.length; a += 2) if (Math.abs(gp.axes[a]) > Math.abs(ax)) ax = gp.axes[a];
      if (Math.abs(ax) > 0.4) posX = clamp(posX + ax * 0.9 * dt, -(LANE_HALF - 0.25), LANE_HALF - 0.25);
    }
  }
  function hoverSlot() {
    var origin = new THREE.Vector3(), dir = new THREE.Vector3(0, 0, -1);
    if (renderer.xr.isPresenting && activeCtrl) {
      activeCtrl.getWorldPosition(origin); activeCtrl.getWorldQuaternion(qNow); dir.applyQuaternion(qNow);
      ray.set(origin, dir);
    } else {
      ray.setFromCamera(mouseNDC, camera);
    }
    var hits = ray.intersectObjects(cardPanels.filter(function (p) { return p.mesh.visible; }).map(function (p) { return p.mesh; }), false);
    return hits.length ? hits[0].object.userData.slot : -1;
  }

  // ===== 操作：パソコン（押しつづけて、ためて、はなす） =====
  var mouseNDC = new THREE.Vector2(0, 0), aimX = 0, holdT = 0;
  function holdPower() { var t = holdT % 2.0; return t < 1 ? t : 2 - t; }   // 0→1→0 と行ったり来たり
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  canvas.addEventListener("pointermove", function (e) {
    mouseNDC.set(e.clientX / window.innerWidth * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
    if (state === "ready" && !holding) aimX = mouseNDC.x;
  });
  canvas.addEventListener("pointerdown", function (e) {
    if (renderer.xr.isPresenting || state === "menu") return;
    startAudio();
    mouseNDC.set(e.clientX / window.innerWidth * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
    onPress();
  });
  window.addEventListener("pointerup", function () { if (!renderer.xr.isPresenting) onRelease(); });
  var keys = {};
  window.addEventListener("keydown", function (e) { keys[e.code] = true; });
  window.addEventListener("keyup", function (e) { keys[e.code] = false; });

  var aimLine = new THREE.Mesh(new THREE.PlaneGeometry(0.03, 7), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, depthWrite: false }));
  aimLine.rotation.x = -Math.PI / 2; scene.add(aimLine);

  // ===== 1コマごとの処理 =====
  var clock = new THREE.Clock();
  var pinFrame = 0, physAcc = 0;
  var camFollowZ = 0, camFollowY = 0;
  function tick() {
    var rawDt = Math.min(clock.getDelta(), 0.05);
    var inXR = renderer.xr.isPresenting;

    // スローモーション
    if (slowT > 0) { slowT -= rawDt; if (slowT <= 0) timeScale = 1; }
    else if (timeScale < 1) timeScale = Math.min(1, timeScale + rawDt * 2);
    var dt = rawDt * timeScale;

    if (state !== "menu") {
      if (inXR) { sampleSwing(rawDt); pollPad(rawDt); }
      if (holding) holdT += rawDt;
      if (!inXR && state === "ready" && !holding) {
        if (keys.KeyA || keys.ArrowLeft) posX = clamp(posX - 0.9 * rawDt, -(LANE_HALF - 0.25), LANE_HALF - 0.25);
        if (keys.KeyD || keys.ArrowRight) posX = clamp(posX + 0.9 * rawDt, -(LANE_HALF - 0.25), LANE_HALF - 0.25);
      }
      // 物理は 1/60 秒きざみ
      physAcc += dt;
      var steps = 0;
      while (physAcc >= 1 / 60 && steps < 3) { world.step(1 / 60); applyKicks(); physAcc -= 1 / 60; steps++; }
      if (steps === 3) physAcc = 0;
      syncPins();
      var done = updateBalls(dt);
      if (state === "rolling" || state === "settle") { liveCountPins(); updateBoom(); }
      if (state === "rolling" && done) { state = "settle"; settleT = 0; }
      if (state === "settle") {
        settleT += dt;
        if (settleT > 1.3) { countBall(); state = "result"; settleT = 0; }
      } else if (state === "result") {
        settleT += rawDt;
        if (settleT > 1.0) nextBallOrEnd();
      } else if (state === "clearwait") {
        settleT += rawDt;
        if (settleT > 1.5) { bigText.visible = false; bigT = 0; state = "cards"; showCards(true); }
      }
    }
    updateParticles(dt);
    updateFlashes(dt);
    if (bigT > 0) { bigT -= rawDt; bigAge += rawDt; if (bigT <= 0) bigText.visible = false; }
    var pop = bigAge < 0.18 ? 0.6 + bigAge / 0.18 * 0.55 : (bigAge < 0.3 ? 1.15 - (bigAge - 0.18) / 0.12 * 0.15 : 1);
    bigText.scale.setScalar(pop);
    if (cntPop > 0) { cntPop = Math.max(0, cntPop - rawDt * 6); cntText.scale.setScalar(1 + cntPop * 0.35); }
    // 数字はピンの少し手前、プレイヤーのほうを向く
    cntText.position.set(0, 1.1, HEAD_Z + 3.5);

    // 立ち位置とカメラ
    rig.position.set(posX, inXR ? EYE : 0, PLAYER_Z);
    if (!inXR) {
      var lookYaw = -aimX * 0.1, pitch = -0.14, back = 0;
      // 玉を追いかけるカメラ（パソコンだけ。VRでは酔うのでやらない）
      var targetZ = 0, targetY = 0;
      if ((state === "rolling" || state === "settle" || state === "result") && balls.length) {
        var lz = balls[0].body.position.z;
        targetZ = clamp(lz + 4.5 - PLAYER_Z, HEAD_Z + 5.0 - PLAYER_Z, 0);
        targetY = clamp(targetZ * 0.03, -0.5, 0);
        lookYaw = 0;
      }
      // 追いかけるほど、ピンを見下ろす角度にする
      pitch = -0.14 + clamp(camFollowZ / (HEAD_Z + 5.0 - PLAYER_Z), 0, 1) * -0.2;
      camFollowZ += (targetZ - camFollowZ) * Math.min(1, rawDt * (targetZ < camFollowZ ? 2.2 : 3));
      camFollowY += (targetY - camFollowY) * Math.min(1, rawDt * 3);
      if (state === "cards") { pitch = -0.1; lookYaw = 0; back = camera.aspect < 1.2 ? 1.3 : 0.4; }
      var sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
      camera.position.set(-posX * (camFollowZ < -1 ? 1 : 0) + sx, EYE + camFollowY + sy, back + camFollowZ);
      camera.rotation.set(pitch, lookYaw, 0);
      powerEl.hidden = !holding;
      if (holding) powerBar.style.width = (holdPower() * 100).toFixed(0) + "%";
    } else {
      powerEl.hidden = true;
    }
    shake *= Math.pow(0.02, rawDt);
    handBall.visible = inXR && holding;
    pointer.visible = inXR && state === "cards";
    aimLine.visible = state === "ready";
    if (aimLine.visible) {
      var ang = 0;
      if (inXR && activeCtrl) {
        activeCtrl.getWorldQuaternion(qNow);
        var f = new THREE.Vector3(0, 0, -1).applyQuaternion(qNow);
        ang = Math.sqrt(f.x * f.x + f.z * f.z) > 0.3 ? clamp(Math.atan2(f.x, -f.z) * 0.4, -0.07, 0.07) : 0;
      } else ang = aimX * 0.07;
      aimLine.position.set(posX + Math.sin(ang) * 3.7, 0.004, -0.25 - Math.cos(ang) * 3.7);
      aimLine.rotation.z = ang;
    }
    if (state === "cards") {
      var hs = hoverSlot();
      cardPanels.forEach(function (p, i) {
        var hv = i === hs;
        if (hv !== p.hover && p.card) { p.hover = hv; drawCard(p); }
        p.mesh.scale.setScalar(p.hover ? 1.06 : 1);
      });
    }
    drawMonitor();

    pinFrame++;
    if (pinFrame % 2 === 0) {
      var xrOn = renderer.xr.enabled, prevRT = renderer.getRenderTarget();
      renderer.xr.enabled = false;
      renderer.setRenderTarget(pinRT);
      renderer.render(scene, pinCam);
      renderer.setRenderTarget(prevRT);
      renderer.xr.enabled = xrOn;
    }
    renderer.render(scene, camera);
  }

  function onResize() {
    if (renderer.xr.isPresenting) return;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener("resize", onResize);

  // ===== はじめ方 =====
  function showOverlay(show) { overlay.hidden = !show; }
  btnFlat.addEventListener("click", function () { startAudio(); newRun(); showOverlay(false); });
  btnVR.addEventListener("click", function () {
    startAudio();
    if (!navigator.xr) return;
    navigator.xr.requestSession("immersive-vr").then(function (session) {
      session.addEventListener("end", function () {
        state = "menu"; holding = false; showCards(false); bigText.visible = false;
        camera.position.set(0, EYE, 0);
        showOverlay(true); onResize(); updateEyebrow();
      });
      return renderer.xr.setSession(session).then(function () {
        camera.position.set(0, 0, 0);
        newRun();
        showOverlay(false);
      });
    }).catch(function (err) {
      note.textContent = "VRを始められませんでした（" + (err && err.message ? err.message : err) + "）。";
    });
  });
  if (navigator.xr && navigator.xr.isSessionSupported) {
    navigator.xr.isSessionSupported("immersive-vr").then(function (ok) {
      btnVR.disabled = !ok;
      note.textContent = ok ? "VRゴーグルの中なら「VRで遊ぶ」を押してください。" : "このブラウザではVRが使えません。「画面で遊ぶ」で試せます。";
    }).catch(function () { note.textContent = "このブラウザではVRが使えません。「画面で遊ぶ」で試せます。"; });
  } else {
    note.textContent = "このブラウザではVRが使えません。「画面で遊ぶ」で試せます。";
  }
  function updateEyebrow() {
    eyebrow.textContent = "全10ゲーム ・ 3枚から1枚えらぶ" + (best > 0 ? " ・ 最高 第" + best + "ゲームまでクリア" : "");
  }

  drawMask(1);
  rackPins();
  updateEyebrow();
  camera.position.set(0, EYE, 0);
  renderer.setAnimationLoop(tick);
})();
</script>
</body>
</html>
